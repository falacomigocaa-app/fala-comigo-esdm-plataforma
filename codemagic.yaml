workflows:
  android-release:
    name: Android release (APK + AAB)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.47.6
      groups:
        - beta-env
      android_signing:
        - fala-comigo-release
    scripts:
      - name: Get Flutter packages
        script: flutter pub get --enforce-lockfile
      - name: Create Android key.properties
        script: |
          cat > "$CM_BUILD_DIR/android/key.properties" <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF
      - name: Analyze and test
        script: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
      - name: Validate beta build variables
        script: |
          set -eu
          : "${PORTAL_API_BASE_URL:?PORTAL_API_BASE_URL must be configured in Codemagic}"
          : "${BETA_START_AT:?BETA_START_AT must be configured in Codemagic}"
          : "${BETA_DURATION_DAYS:?BETA_DURATION_DAYS must be configured in Codemagic}"
          : "${BETA_BYPASS_EMAILS:?BETA_BYPASS_EMAILS must be configured in Codemagic}"
      - name: Build signed APK
        script: |
          flutter build apk --release \
            --dart-define="PORTAL_API_BASE_URL=${PORTAL_API_BASE_URL}" \
            --dart-define="BETA_START_AT=${BETA_START_AT}" \
            --dart-define="BETA_DURATION_DAYS=${BETA_DURATION_DAYS}" \
            --dart-define="BETA_BYPASS_EMAILS=${BETA_BYPASS_EMAILS}"
      - name: Build signed AAB
        script: |
          flutter build appbundle --release \
            --dart-define="PORTAL_API_BASE_URL=${PORTAL_API_BASE_URL}" \
            --dart-define="BETA_START_AT=${BETA_START_AT}" \
            --dart-define="BETA_DURATION_DAYS=${BETA_DURATION_DAYS}" \
            --dart-define="BETA_BYPASS_EMAILS=${BETA_BYPASS_EMAILS}"
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/release/*.aab
      - build/**/outputs/**/mapping.txt

  web-release:
    name: Web release
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: 3.47.6
      groups:
        - beta-env
    scripts:
      - name: Get Flutter packages
        script: flutter pub get --enforce-lockfile
      - name: Analyze and test
        script: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
      - name: Validate beta build variables
        script: |
          set -eu
          : "${PORTAL_API_BASE_URL:?PORTAL_API_BASE_URL must be configured in Codemagic}"
          : "${BETA_START_AT:?BETA_START_AT must be configured in Codemagic}"
          : "${BETA_DURATION_DAYS:?BETA_DURATION_DAYS must be configured in Codemagic}"
          : "${BETA_BYPASS_EMAILS:?BETA_BYPASS_EMAILS must be configured in Codemagic}"
      - name: Build Web
        script: |
          flutter build web --release \
            --dart-define="PORTAL_API_BASE_URL=${PORTAL_API_BASE_URL}" \
            --dart-define="BETA_START_AT=${BETA_START_AT}" \
            --dart-define="BETA_DURATION_DAYS=${BETA_DURATION_DAYS}" \
            --dart-define="BETA_BYPASS_EMAILS=${BETA_BYPASS_EMAILS}"
    artifacts:
      - build/web/**
