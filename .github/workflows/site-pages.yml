name: Publicar site institucional, portal profissional e app Flutter Web

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tests/**"
      - "lib/**"
      - "test/**"
      - "web/**"
      - "assets/**"
      - "pubspec.*"
      - "portal-web/**"
      - ".github/workflows/site-pages.yml"
      - ".github/workflows/static.yml"
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - "tests/**"
      - "lib/**"
      - "test/**"
      - "web/**"
      - "assets/**"
      - "pubspec.*"
      - "portal-web/**"
      - ".github/workflows/site-pages.yml"
      - ".github/workflows/static.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Testar conteúdo e links do site
        run: node --test tests/*.test.mjs

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          cache: true

      - name: Construir app Web para a subrota do Pages
        run: |
          flutter pub get --enforce-lockfile
          flutter build web --release --base-href /fala-comigo/app/
          test -s build/web/index.html
          grep -F '<base href="/fala-comigo/app/">' build/web/index.html

      - name: Preparar payload do Pages
        run: |
          test -s site/index.html
          test -s site/styles.css
          test -s site/privacy.html
          test -s site/portal.html
          test -s site/portal.css
          test -s site/console-preview.html
          test -s site/rh/index.html
          test -s site/rh/styles.css
          rm -rf public
          mkdir -p public/app public/portal
          cp -a site/. public/
          cp -a build/web/. public/app/
          cp -a portal-web/. public/portal/
          python3 - <<'PY'
          from pathlib import Path
          path = Path('public/portal/index.html')
          html = path.read_text()
          injection = '<script>window.PORTAL_API_BASE="https://fala-comigo-api-beta.onrender.com";</script>'
          path.write_text(html.replace('</head>', f'{injection}</head>'))
          PY
          test -s public/app/index.html
          test -s public/portal/index.html

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload do artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
