name: Android validation APK and AAB artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-apk:
    name: Build non-production test APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create ephemeral test signing key
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/fala-comigo-test.jks" \
            -storepass changeit \
            -keypass changeit \
            -alias fala-comigo-test \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=Fala Comigo CI Test, OU=Development, O=Fala Comigo, C=BR"
          cat > android/key.properties <<EOF
          storePassword=changeit
          keyPassword=changeit
          keyAlias=fala-comigo-test
          storeFile=$RUNNER_TEMP/fala-comigo-test.jks
          EOF

      - name: Build release test APK
        run: flutter build apk --release

      - name: Build validation AAB
        run: flutter build appbundle --release

      - name: Verify APK and record hash
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk build/app/outputs/bundle/release/app-release.aab | tee apk-sha256.txt
          jarsigner -verify build/app/outputs/bundle/release/app-release.aab
          sdk_root="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          apksigner_path="$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner_path"
          "$apksigner_path" verify --verbose build/app/outputs/flutter-apk/app-release.apk

      - name: Stage APK artifact files
        run: |
          mkdir -p artifact
          cp build/app/outputs/flutter-apk/app-release.apk artifact/fala-comigo-test.apk
          cp build/app/outputs/bundle/release/app-release.aab artifact/fala-comigo-validation.aab
          cp apk-sha256.txt artifact/apk-sha256.txt
          test -s artifact/fala-comigo-test.apk
          test -s artifact/apk-sha256.txt

      - name: Publish installable test artifact
        uses: actions/upload-artifact@v4
        with:
          name: fala-comigo-test-apk-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            artifact/fala-comigo-test.apk
            artifact/apk-sha256.txt
            artifact/fala-comigo-validation.aab

      - name: Clean ephemeral signing files
        if: always()
        run: |
          rm -f android/key.properties "$RUNNER_TEMP/fala-comigo-test.jks"
