name: Portal web checks
on:
  pull_request:
  push:
    branches: [main, 'feat/**', 'coderabbit/**']
permissions:
  contents: read
jobs:
  portal-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run check && npm test
        working-directory: portal-web
