name: Flutter quality checks

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Verify code formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Verify release signing policy
        run: |
          if grep -q 'signingConfigs.getByName("debug")' android/app/build.gradle.kts; then
            echo "Release builds must never fall back to the debug signing key."
            exit 1
          fi

      - name: Tests
        run: flutter test

      - name: Web release build
        run: flutter build web --release
