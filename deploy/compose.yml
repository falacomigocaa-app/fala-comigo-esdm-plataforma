services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fala_comigo
      POSTGRES_USER: fala_comigo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure a private database password}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U fala_comigo -d fala_comigo']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  api:
    build: ../portal-api
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Configure the private PostgreSQL connection string}
      JWT_SECRET: ${JWT_SECRET:?Configure a random JWT secret}
      MASTER_CRYPTO_KEY: ${MASTER_CRYPTO_KEY:?Configure a base64 key of 32 bytes}
      PORTAL_WEB_ORIGIN: https://${PORTAL_DOMAIN:?Configure the portal hostname}
      PORTAL_APP_ORIGIN: https://${SITE_DOMAIN:?Configure the website hostname}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  portal:
    build: ../portal-web
    environment:
      PORTAL_API_UPSTREAM: http://api:8787
    depends_on: [api]
    restart: unless-stopped
  edge:
    image: caddy:2-alpine
    environment:
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:?Configure the portal hostname}
      API_DOMAIN: ${API_DOMAIN:?Configure the mobile API hostname}
      SITE_DOMAIN: ${SITE_DOMAIN:?Configure the website hostname}
    ports: ['80:80', '443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../site:/srv/site:ro
      - ../build/web:/srv/app:ro
      - certificates:/data
      - caddy_config:/config
    depends_on: [portal, api]
    restart: unless-stopped
volumes:
  database:
  certificates:
  caddy_config:
